name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # vinext's static-export prerender doesn't support next.config.ts's
      # `basePath`, so project-page hosting (served from /<repo>/) is handled
      # here instead: prefix the exported HTML's root-absolute asset URLs.
      - name: Rewrite asset paths for GitHub Pages subpath
        run: |
          sed -i 's#"/_next/#"/${{ github.event.repository.name }}/_next/#g' dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
